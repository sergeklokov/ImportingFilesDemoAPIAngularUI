<div class="app-container">
  <header class="app-header">
    <h1>{{ title() }}</h1>
  </header>

  <nav class="app-nav">
    <button 
      [class.active]="activeTab() === 'weather'"
      (click)="switchTab('weather')"
      class="nav-button">
      Weather Forecast
    </button>
    <button 
      [class.active]="activeTab() === 'import'"
      (click)="switchTab('import')"
      class="nav-button">
      Import File
    </button>
    <button
      [class.active]="activeTab() === 'bulk-import'"
      (click)="switchTab('bulk-import')"
      class="nav-button">
      Bulk Import File
    </button>
  </nav>

  <main class="app-content">
    @if (activeTab() === 'weather') {
      <app-weather></app-weather>
    } @else if (activeTab() === 'import') {
      <app-import></app-import>
    } @else if (activeTab() === 'bulk-import') {
      <app-bulk-import></app-bulk-import>
    }
  </main>
</div>
