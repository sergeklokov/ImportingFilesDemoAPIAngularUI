<div class="import-container">
  <h1>Import File</h1>

  <div class="import-form">
    <div class="form-group">
      <label for="sourceType">Source Type:</label>
      <select 
        id="sourceType" 
        [value]="sourceType()" 
        (change)="onSourceTypeChange($any($event.target).value)"
        class="form-control">
        @for (type of sourceTypes; track type) {
          <option [value]="type">{{ type }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="createdBy">Created By:</label>
      <input 
        id="createdBy" 
        type="text" 
        [value]="createdBy()" 
        (change)="onCreatedByChange($any($event.target).value)"
        class="form-control"
        placeholder="Username or identifier">
    </div>

    <div class="form-group">
      <label for="fileInput">Select File:</label>
      <input 
        id="fileInput" 
        type="file" 
        (change)="onFileSelected($event)"
        class="form-control"
        accept=".csv,.txt">
      @if (selectedFile(); as file) {
        <small class="file-info">Selected: {{ file.name }}</small>
      }
    </div>

    <button 
      (click)="onSubmit()" 
      [disabled]="isLoading()"
      class="btn-upload">
      @if (isLoading()) {
        Uploading...
      } @else {
        Upload File
      }
    </button>
  </div>

  @if (message()) {
    <div [ngClass]="'message ' + messageType()">
      {{ message() }}
    </div>
  }
</div>
